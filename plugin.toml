[plugin]
name = "fledge-plugin-swift-format"
version = "0.2.0"
description = "Format and lint Swift code with CorvidLabs style"
author = "0xLeif"
protocol = "fledge-v1"

[capabilities]
exec = true
metadata = true

[hooks]
build = "swift build -c release"

[[commands]]
name = "swift-format"
description = "Format and lint Swift files with CorvidLabs style"
binary = ".build/release/fledge-plugin-swift-format"
